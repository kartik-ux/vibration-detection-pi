[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibration-detection-pi"
version = "1.0.0"
description = "Edge AI vibration monitoring and predictive maintenance for Raspberry Pi"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
pi = ["smbus2>=0.4"]
dashboard = ["matplotlib>=3.7"]
test = ["pytest>=7.4"]

[project.scripts]
vibration-pi = "vibration_pi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
